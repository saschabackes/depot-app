[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# QR-Etiketten verlinken auf /pantry/<id> → App ausliefern
[[redirects]]
  from = "/pantry/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Content-Security-Policy = "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"

# Lokale Entwicklung: `netlify dev` startet Vite + Functions zusammen,
# inkl. der /.netlify/functions/* Routen – verhält sich wie die Live-Seite.
[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "vite"
